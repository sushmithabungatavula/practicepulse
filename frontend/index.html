  <body>
    <!--
      THESIS: PracticePulse is a graded operating ledger for an independent
      instructor's practice, not a soft wellness app - it refuses both the
      pastel-zen SaaS default and the cold enterprise-dashboard default.
      OWN-WORLD: cool neutral paper ground (deliberately not cream), near-
      black ink type, one restrained stamp-red accent used only as a literal
      grading/approval mark, never decoratively; ruled, tabular layout with
      zero border-radius. Archivo carries every headline (display weight
      does the work a "high-contrast serif" cliche usually would), JetBrains
      Mono carries every number as ledger numerals. Hairline rules stand in
      for card chrome; a hand-drawn circle "stamps" a selected grade.
      STORY: a visiting instructor understands in seconds that this is a
      serious, data-literate operating tool that will make their practice
      look and run more professionally - not a toy, not a spa app.
      FIRST VIEWPORT: a dominant full-bleed graded stat anchors the hero,
      ruled like a report masthead, the lead number stamped in red; the
      primary action reads as an ink stamp, not a soft pill.
      FORM: The Ledger, direction 3 of 7 grounded candidates, seed 0b771ea1.
      EXCEPTION: the public Landing page (/) is deliberately outside this
      system per an explicit, informed user override on 2026-09-16 - see
      its own "warm" tokens in tailwind.config.js and Landing.jsx. Every
      other route stays on The Ledger.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
