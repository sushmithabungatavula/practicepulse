    <title>PracticePulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

  <body>
    <!--
      NOTE ON HISTORY: this app shipped an earlier system, "The Ledger"
      (ink-on-paper, zero radius, monospace numerals, no serif), chosen
      through a structured design process specifically to avoid the warm-
      cream-plus-serif look common to wellness-app templates. On 2026-09-16
      the user saw a specific reference template, asked for that look on the
      Landing page, was told this reverses that direction, confirmed anyway,
      and then asked for the same warm system applied consistently across
      the whole app. This file is that unified system: warm cream ground,
      terracotta accent, deep forest-green dark surfaces, Playfair Display
      for headlines, Poppins for body/UI. One look, every route, including
      signed-in screens. The Ledger's tokens and components have been
      removed rather than left dormant.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
